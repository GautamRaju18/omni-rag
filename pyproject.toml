[project]
name = "omnirag"
version = "0.1.0"
description = "OmniRAG: local-first multimodal graph-based retrieval augmented generation platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Exact pins for reproducibility; transitive versions live in uv.lock.
# Heavy deps (docling, torch, sentence-transformers, langgraph...) arrive in their own phases.
dependencies = [
    "beautifulsoup4==4.15.0",
    "defusedxml==0.7.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langgraph==1.2.19",
    "markdown-it-py==4.2.0",
    "neo4j==6.4.1",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "python-pptx==1.0.2",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
]
# Layout-model PDF parsing (Phase 2d). Heavy: torch + model weights. Installed by default
# (see default-groups); a slim install is `uv sync --no-group layout`, and the code falls back
# to PyMuPDF when Docling is missing.
layout = [
    "docling==2.141.0",
    # Listed directly only so [tool.uv.sources] applies: uv ignores sources for transitive
    # dependencies, and without this PyPI's CUDA build (+cu132, ~5 GB) gets installed.
    "torch==2.15.0",
    "torchvision==0.29.2",
]
# Dashboard (Streamlit; Phase 14's retrieval laboratory, pulled forward in Phase 9b).
frontend = [
    "streamlit==1.66.1",
]

[tool.uv]
default-groups = ["dev", "layout", "frontend"]

# CPU-only PyTorch: the 6 GB GPU is reserved for Ollama, and CUDA wheels add several GB.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnirag"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear
    "UP",    # pyupgrade
    "ASYNC", # blocking calls inside async code
    "S",     # bandit security checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"] # pytest asserts; dummy passwords in fixtures

# -------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs live Neo4j and Ollama (run with: pytest -m integration)",
    "docling: runs the real Docling models, ~1 min start-up (run with: pytest -m docling)",
]
addopts = "-ra -m 'not integration and not docling'"

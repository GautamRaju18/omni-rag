# Neo4j (Phase 1), a throwaway test instance (Phase 5), and the API + dashboard (Phase 15,
# profile "app": docker compose --profile app up -d --build). Ollama stays on the host: it owns
# the GPU. Memory is budgeted for a 16 GB laptop: the whole WSL VM is capped at 8 GB
# (neo4j 2g + api 3g + dashboard 768m).
name: omnirag

services:
  neo4j:
    image: neo4j:2026.10.1-community
    container_name: omnirag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt protocol (driver)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_server_jvm_additional: -XX:+ExitOnOutOfMemoryError
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Throwaway Neo4j for integration tests: Community edition has one user database, so tests
  # get their own server instead of touching real data. Data lives in RAM (tmpfs) and is gone
  # when the container stops. Start with:  docker compose --profile test up -d neo4j-test
  neo4j-test:
    image: neo4j:2026.10.1-community
    container_name: omnirag-neo4j-test
    profiles: ["test"]
    ports:
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    tmpfs:
      - /data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s

  # The API: one process (the ingestion job manager and evaluation runs are in-process).
  # Data (originals, elements, chunks, embedding cache, chat history, tokenizer) is the host's
  # OMNIRAG_HOST_DATA_DIR (default ~/omnirag-data), so the container sees what the CLI built.
  api:
    build: .
    image: omnirag:0.1.0
    container_name: omnirag-api
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    env_file: .env # OMNIRAG_NEO4J_PASSWORD; never baked into the image
    environment:
      OMNIRAG_NEO4J_URI: bolt://neo4j:7687
      OMNIRAG_OLLAMA_BASE_URL: http://host.docker.internal:11434
      OMNIRAG_DATA_DIR: /data
      OMNIRAG_LOG_JSON: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${OMNIRAG_HOST_DATA_DIR:-${HOME}/omnirag-data}:/data
      # measured reports (rag_eval output) shown by /evaluate and /analytics, without a rebuild
      - ./docs/benchmarks:/app/docs/benchmarks:ro
    ports:
      - "8000:8000"
    mem_limit: 3g # reranker (torch CPU) + Docling when used
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/openapi.json", "-o", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  dashboard:
    image: omnirag:0.1.0
    container_name: omnirag-dashboard
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      OMNIRAG_FRONTEND_API_URL: http://api:8000
    command: ["streamlit", "run", "src/omnirag/frontend/app.py", "--server.address=0.0.0.0",
              "--server.port=8501", "--server.headless=true"]
    ports:
      - "8501:8501"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
  neo4j_logs:
